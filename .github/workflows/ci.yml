name: Validate

on:
  push:
    branches: [main, 'preview/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate data, application, tests, and static export
        run: pnpm check

  tile-infrastructure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/deepzoom
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: infrastructure/deepzoom/pnpm-lock.yaml
      - name: Install pinned infrastructure dependencies
        run: pnpm install --frozen-lockfile
      - name: Test generator, verifier, and Worker
        run: pnpm test
      - name: Validate Worker bundle
        run: pnpm exec wrangler deploy --config wrangler.jsonc --dry-run --outdir .wrangler/dry-run
